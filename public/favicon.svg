<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55">
        <animate attributeName="stop-opacity"
                 values="0.3;0.7;0.3"
                 dur="2.2s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6b5040" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1a1410"/>

  <!-- Pulsing glow circle -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)">
    <animate attributeName="r"
             values="24;27;24"
             dur="2.2s"
             repeatCount="indefinite"/>
  </circle>

  <!-- DA Text -->
  <text x="50%" y="54%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-size="22"
        font-weight="700"
        fill="#f5f0eb"
        font-family="Inter, system-ui, sans-serif"
        letter-spacing="2"
        filter="url(#softGlow)">
    DA
  </text>
</svg>